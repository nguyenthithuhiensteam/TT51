<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CTGDMN – Bản HTML thử nghiệm</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#173b43;background:#f3f7f8}*{box-sizing:border-box}body{margin:0}header{height:64px;background:#0d5258;color:#fff;display:flex;align-items:center;padding:0 24px;gap:16px}header img{width:38px;height:38px;object-fit:contain}header h1{font-size:18px;margin:0}.layout{display:flex;min-height:calc(100vh - 64px)}nav{width:250px;background:#fff;border-right:1px solid #d8e4e5;padding:14px;overflow:auto}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:9px;margin:3px 0;color:#244b52;cursor:pointer}nav button.active,nav button:hover{background:#e4f2f1;color:#0b6368;font-weight:600}main{flex:1;padding:28px;max-width:1250px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card,.panel{background:#fff;border:1px solid #d9e7e8;border-radius:14px;padding:18px;box-shadow:0 3px 12px #123b430b}.card{cursor:pointer}.card:hover{border-color:#0b8687}.muted{color:#648086}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:8px;padding:10px 14px;background:#0d777a;color:#fff;cursor:pointer}.btn.secondary{background:#e3efef;color:#14535a}.btn:disabled{opacity:.45;cursor:not-allowed}.input,textarea,select{border:1px solid #b8ced0;border-radius:8px;padding:10px;font:inherit;width:100%}textarea{min-height:180px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #e1ebec;text-align:left}.notice{background:#fff5d9;border-left:4px solid #e1a800;padding:12px;border-radius:6px}.status{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:20px;background:#e3efef}.online{color:#087a5a}.offline{color:#a34d1c}.hidden{display:none}.small{font-size:13px}.logo-fallback{font-weight:700;color:#fff}
</style></head>
<body>
<header><img src="assets/icon.png" onerror="this.style.display='none'" alt=""><span class="logo-fallback">CTGDMN</span><h1>Bản HTML thử nghiệm – 2026–2027</h1></header>
<div class="layout"><nav id="nav"></nav><main id="main"></main></div>
<script>
const services=[['chatgpt','ChatGPT','https://chatgpt.com'],['gemini','Gemini','https://gemini.google.com'],['copilot','Microsoft Copilot','https://copilot.microsoft.com']];
const docs=[{id:'doc-001',title:'Kế hoạch tuần – Rèn nền nếp',age:'18–24 tháng',type:'Kế hoạch/giáo án tuần',pdf:'program-documents/doc-7e7968118bba.pdf',page:1},{id:'doc-002',title:'Mục tiêu phát triển ngôn ngữ',age:'3–4 tuổi',type:'Mục tiêu/kế hoạch chủ đề',pdf:'program-documents/doc-b1ca3f519e69.pdf',page:3},{id:'doc-003',title:'Kế hoạch tháng – Bé và gia đình',age:'4–5 tuổi',type:'Kế hoạch tháng',pdf:'program-documents/doc-5547050edc42.pdf',page:2}];
const routes=[['work-center','Trung tâm công việc'],['program-builder','Xây dựng chương trình'],['open-data','Kho dữ liệu'],['planner','Soạn kế hoạch'],['evaluation','Đánh giá và điều chỉnh'],['approval','Rà soát – phê duyệt'],['online-resources','AI và nguồn trực tuyến'],['reports','Báo cáo'],['backup','Dữ liệu và sao lưu'],['settings','Cài đặt']];
let route='work-center', plans=JSON.parse(localStorage.getItem('ctgdmn-preview-plans')||'[]');
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderNav(){nav.innerHTML=routes.map(([id,label])=>`<button class="${route===id?'active':''}" data-route="${id}">${label}</button>`).join('');nav.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{route=b.dataset.route;render()})}
function head(title,sub=''){return `<h2>${title}</h2><p class="muted">${sub}</p>`}
function render(){renderNav();if(route==='work-center')return work();if(route==='open-data')return library();if(route==='planner')return planner();if(route==='online-resources')return ai();if(route==='backup')return backup();main.innerHTML=`<section class="panel">${head(routes.find(x=>x[0]===route)?.[1]||route,'Màn hình thử nghiệm HTML')}</section>`}
function work(){main.innerHTML=`${head('Trung tâm công việc','Bản xem trước chạy trong trình duyệt, dữ liệu kế hoạch lưu trong localStorage.')}<div class="grid"><article class="card" onclick="route='planner';render()"><h3>Tiếp tục kế hoạch đang soạn</h3><p class="muted">${plans.length} kế hoạch</p></article><article class="card" onclick="route='open-data';render()"><h3>Kho dữ liệu mở</h3><p class="muted">${docs.length} mẫu thử • bản đầy đủ dùng trong ứng dụng Electron</p></article><article class="card"><h3>Kế hoạch chờ rà soát</h3><p class="muted">${plans.filter(p=>p.status==='review').length} hồ sơ</p></article><article class="card"><h3>Cảnh báo dữ liệu</h3><p class="muted">Kiểm tra nguồn PDF trước khi phê duyệt</p></article></div><section class="panel" style="margin-top:18px"><button class="btn" onclick="route='planner';render()">Tạo chương trình năm học 2026–2027</button></section>`}
function library(){main.innerHTML=`${head('Kho dữ liệu mở','Tìm kiếm không dấu/có dấu và mở PDF nguồn.')}<section class="panel"><div class="row"><input id="q" class="input" placeholder="Tìm tiêu đề, độ tuổi, loại hồ sơ"><select id="age" class="input" style="max-width:190px"><option value="">Tất cả độ tuổi</option>${[...new Set(docs.map(d=>d.age))].map(a=>`<option>${a}</option>`).join('')}</select></div><div id="rows" style="margin-top:14px"></div></section>`;const draw=()=>{const q=norm(qel.value),a=age.value;rows.innerHTML=docs.filter(d=>(!q||norm(JSON.stringify(d)).includes(q))&&(!a||d.age===a)).map(d=>`<div class="card" style="margin:8px 0"><strong>${esc(d.title)}</strong><div class="small muted">${esc(d.age)} • ${esc(d.type)} • trang ${d.page}</div><div class="row" style="margin-top:8px"><button class="btn secondary" onclick="window.open('${d.pdf}','_blank')">Mở PDF gốc</button><button class="btn secondary" onclick="alert('Nguồn: ${d.pdf} – trang ${d.page}')">Xem chi tiết</button></div></div>`).join('')||'<p class="muted">Không tìm thấy.</p>'};const qel=document.querySelector('#q'),age=document.querySelector('#age'),rows=document.querySelector('#rows');qel.oninput=draw;age.onchange=draw;draw()}
function planner(){main.innerHTML=`${head('Soạn kế hoạch','Bản thử nghiệm lưu kế hoạch tại localStorage.')}<section class="panel"><label>Tiêu đề kế hoạch<input id="pt" class="input" placeholder="Kế hoạch tuần 1"></label><label>Nội dung<textarea id="pc" placeholder="Mục tiêu, nội dung, hoạt động, học liệu, phân hóa, minh chứng, đánh giá"></textarea></label><div class="row"><button class="btn" onclick="savePlan()">Lưu nháp</button><button class="btn secondary" onclick="route='online-resources';render()">Chuẩn bị prompt cho AI</button></div></section><section class="panel" style="margin-top:18px"><h3>Kế hoạch đã lưu</h3>${plans.map(p=>`<div class="small">${esc(p.title)} – ${new Date(p.updated).toLocaleString('vi-VN')}</div>`).join('')||'<p class="muted">Chưa có kế hoạch.</p>'}</section>`}
function savePlan(){const title=pt.value.trim();if(!title)return alert('Nhập tiêu đề kế hoạch.');plans.push({title,content:pc.value,status:'draft',updated:Date.now()});localStorage.setItem('ctgdmn-preview-plans',JSON.stringify(plans));alert('Đã lưu nháp.');render()}
function ai(){const online=navigator.onLine;main.innerHTML=`${head('AI và nguồn trực tuyến','Các liên kết mở bằng trình duyệt mặc định; không tự động gửi prompt.')}<section class="panel"><span class="status ${online?'online':'offline'}">● ${online?'Trực tuyến':'Ngoại tuyến'}</span><div class="notice" style="margin:14px 0">Không đưa họ tên, ngày sinh, sức khỏe, hình ảnh, hoàn cảnh gia đình hoặc thông tin nhận dạng của trẻ lên dịch vụ AI công cộng.</div><div class="row">${services.map(s=>`<button class="btn" ${online?'':'disabled'} onclick="openAi('${s[2]}')">${s[1]}</button>`).join('')}</div></section><section class="panel" style="margin-top:18px"><h3>Prompt</h3><textarea id="prompt" placeholder="Nhập nội dung kế hoạch cần hỗ trợ"></textarea><div id="warn" class="notice hidden"></div><div class="row" style="margin-top:10px"><button class="btn secondary" onclick="makePrompt()">Tạo prompt có cấu trúc</button><button class="btn" onclick="copyPrompt()">Sao chép prompt</button></div></section>`}
function openAi(url){if(!/^https:\/\//.test(url))return alert('Chỉ cho phép HTTPS.');if(confirm('Không gửi dữ liệu cá nhân của trẻ lên AI. Mở liên kết?'))window.open(url,'_blank','noopener')}
function makePrompt(){prompt.value=`# Hỗ trợ giáo dục mầm non\n\n## Nội dung cần hỗ trợ\n${prompt.value||'[Nhập nội dung kế hoạch]'}\n\n## Yêu cầu\n- Trả lời bằng tiếng Việt, phù hợp độ tuổi.\n- Đánh dấu AI đề xuất – cần giáo viên rà soát.\n- Không yêu cầu dữ liệu cá nhân của trẻ.`;checkPersonal()}
function checkPersonal(){const w=[];if(/\b(?:0|\+84)[ .-]?\d{8,10}\b/.test(prompt.value))w.push('Có thể chứa số điện thoại.');if(/[\w.-]+@[\w.-]+\.[A-Za-z]{2,}/.test(prompt.value))w.push('Có thể chứa email.');if(/ngày sinh|sinh ngày/i.test(prompt.value))w.push('Có thể chứa ngày sinh.');warn.textContent=w.join(' ');warn.classList.toggle('hidden',!w.length)}
function copyPrompt(){if(!prompt.value.trim())return alert('Hãy nhập prompt trước.');checkPersonal();if(!warn.classList.contains('hidden')&&!confirm('Prompt có dấu hiệu dữ liệu cá nhân. Bạn vẫn muốn sao chép?'))return;navigator.clipboard?.writeText(prompt.value).then(()=>alert('Đã sao chép prompt.'))}
function backup(){main.innerHTML=`${head('Dữ liệu và sao lưu','Xuất/nhập dữ liệu kế hoạch thử nghiệm JSON.')}<section class="panel"><button class="btn" onclick="downloadBackup()">Xuất JSON</button><input id="imp" type="file" accept=".json" class="input" style="margin-top:12px"><p class="small muted">Bản HTML chỉ dùng localStorage; bản Electron dùng SQLite và sao lưu đầy đủ.</p></section>`;imp.onchange=()=>{const f=imp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{plans=JSON.parse(r.result).plans||[];localStorage.setItem('ctgdmn-preview-plans',JSON.stringify(plans));alert('Đã nhập sao lưu.');render()}catch{alert('Tệp JSON không hợp lệ.')}};r.readAsText(f)}}
function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({format:'ctgdmn-preview',plans},null,2)],{type:'application/json'}));a.download='ctgdmn-preview-backup.json';a.click()}
window.addEventListener('online',render);window.addEventListener('offline',render);render();
</script></body></html>
